name: Build Android APK

on:
  workflow_dispatch:        # زر "Run workflow" يدوي
  push:
    branches: [main, master]

env:
  GODOT_VERSION: "4.3"

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK parts
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" "cmdline-tools;latest"

      - name: Install Godot and export templates
        run: |
          cd "$RUNNER_TEMP"
          BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure Godot for Android (debug keystore)
        run: |
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          for f in "editor_settings-4.tres" "editor_settings-${GODOT_VERSION}.tres"; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo '[resource]'
              echo "export/android/android_sdk_path = \"${ANDROID_HOME}\""
              echo "export/android/java_sdk_path = \"${JAVA_HOME}\""
              echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
              echo 'export/android/debug_keystore_user = "androiddebugkey"'
              echo 'export/android/debug_keystore_pass = "android"'
            } > "$HOME/.config/godot/$f"
          done

      - name: Build APK
        run: |
          mkdir -p build
          godot --headless --path . --import || true
          godot --headless --path . --export-debug "Android" build/LoCal_LoL.apk
          ls -la build

      - uses: actions/upload-artifact@v4
        with:
          name: LoCal_LoL-apk
          path: build/LoCal_LoL.apk
